name: Refresh market data and publish Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.md"
      - "scripts/**"
      - ".github/workflows/market-data-pages.yml"
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch daily market history
        run: |
          mkdir -p dist
          python scripts/fetch_market_data.py --range 5y --output dist/market-data.json
          cp *.html *.js *.md dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
